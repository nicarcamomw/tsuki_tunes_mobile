name: tsuki_tunes_mobile
description: "Tsuki Tunes Mobile - Cyberpunk & Anime Music Player with Deezer API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Texts in lib/l10n/*.arb, compiled by `flutter gen-l10n`.
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI, Fonts and Icons
  cupertino_icons: ^2.0.0
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

  # State Management
  # Audio Playback
  just_audio: ^0.9.46
  audio_video_progress_bar: ^2.0.3

  # Logging
  logging: ^1.3.0

  # Networking & Storage
  http: ^1.3.0
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.1

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^6.2.2
  flutter_web_auth_2: 6.0.0-alpha.9
  crypto: ^3.0.7

  # Share & Path
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2

  # Home Screen Widgets
  home_widget: ^0.10.0

  # Voice Search (on-device speech recognition)
  speech_to_text: ^7.5.0

  # Release radar: daily background check + local notifications
  workmanager: ^0.10.10
  flutter_local_notifications: ^19.4.2
  # Quiet reminders at a set time (the daily streak).
  timezone: ^0.10.1

  # Offline Translation (Google ML Kit)
  google_mlkit_translation: ^0.13.0

  # Spotify Native Playback
  spotify_sdk: ^4.0.0
  audio_session: ^0.1.25
  audio_service: ^0.18.19
  firebase_crashlytics: ^6.0.1
  firebase_app_check: ^0.5.1
  firebase_remote_config: ^7.0.1
  firebase_performance: ^0.12.1
  firebase_analytics: ^13.0.1
  sensors_plus: ^7.1.1
  geolocator: ^14.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_riverpod: ^3.4.3
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  collection: ^1.19.1
  google_mlkit_language_id: ^0.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.5.0
  # Fake audio backend for widget tests.
  just_audio_platform_interface: ^4.6.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  # injectable_generator still builds on build 4 / analyzer < 14.2, which
  # build_runner 2.17.1 (build 5) left behind.
  build_runner: ">=2.16.1 <2.17.1"
  path: ^1.9.1
  # 3.1.3 needs an analyzer older than the one freezed uses.
  injectable_generator: ">=3.1.1 <3.1.3"
  go_router_builder: ^4.5.3
  drift_dev: ^2.35.2
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter

flutter:
  # Builds and runs are the dev environment unless --flavor prod is given
  # (android/app/build.gradle.kts): only CI's release builds are prod.
  default-flavor: dev
  uses-material-design: true
  # Compiles lib/l10n/*.arb (see l10n.yaml) on pub get and build.
  generate: true

  assets:
    - assets/images/
    - assets/images/masks/
    # New masks, by rarity (tool/add_mask.py puts them here).
    - assets/images/masks/r/
    - assets/images/masks/sr/
    - assets/images/masks/ssr/
    - assets/images/masks/ul/

  fonts:
    - family: SystemOfADown
      fonts:
        - asset: assets/fonts/sf_hollywood_hills.ttf
    - family: Metallica
      fonts:
        - asset: assets/fonts/pastor_of_muppets.ttf
    - family: HelveticaBlackOblique
      fonts:
        - asset: assets/fonts/helvetica_black_oblique.otf
    - family: HelveticaBlackRegular
      fonts:
        - asset: assets/fonts/helvetica_black_regular.otf
    - family: Sickness
      fonts:
        - asset: assets/fonts/sickness.ttf
    - family: Satisfaction
      fonts:
        - asset: assets/fonts/satisfaction.ttf
    - family: Squealer
      fonts:
        - asset: assets/fonts/squealer.ttf
    - family: Optionyx
      fonts:
        - asset: assets/fonts/optio_nyx.otf
    - family: Blackpink
      fonts:
        - asset: assets/fonts/blackpink.ttf
    - family: EuroSwh
      fonts:
        - asset: assets/fonts/euroswh.ttf
    - family: Resurrec
      fonts:
        - asset: assets/fonts/resurrec.ttf
    - family: Bootle
      fonts:
        - asset: assets/fonts/bootle.ttf
    - family: InstantZen
      fonts:
        - asset: assets/fonts/instant_zen.otf
    - family: Densmore
      fonts:
        - asset: assets/fonts/densmore.ttf
    - family: DaftFont
      fonts:
        - asset: assets/fonts/daft_font.ttf
    - family: Trixie
      fonts:
        - asset: assets/fonts/trixie.ttf
    - family: CenturyGothicItalic
      fonts:
        - asset: assets/fonts/century_gothic_italic.ttf
    - family: Rammstein
      fonts:
        - asset: assets/fonts/rammstein.ttf
    - family: Kashmir
      fonts:
        - asset: assets/fonts/kashmir.ttf
    - family: FrizQuadrata
      fonts:
        - asset: assets/fonts/friz_quadrata.otf
    - family: ScaryGlyphs
      fonts:
        - asset: assets/fonts/scary_glyphs.ttf
    - family: LaBamba
      fonts:
        - asset: assets/fonts/la_bamba.otf
    - family: LasVegas
      fonts:
        - asset: assets/fonts/las_vegas.ttf
    - family: Jamiroquai
      fonts:
        - asset: assets/fonts/jamiroquai.ttf
    - family: Americana
      fonts:
        - asset: assets/fonts/americana.otf
    - family: Exo
      fonts:
        - asset: assets/fonts/exo.ttf
