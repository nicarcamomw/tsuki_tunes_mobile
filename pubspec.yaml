name: tsuki_tunes_mobile
description: "Tsuki Tunes Mobile - Cyberpunk & Anime Music Player with Deezer API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Fonts and Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

  # State Management
  provider: ^6.1.2

  # Audio Playback
  just_audio: ^0.9.46
  audio_video_progress_bar: ^2.0.3

  # Networking & Storage
  http: ^1.3.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
