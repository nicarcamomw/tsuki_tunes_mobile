name: tsuki_tunes_mobile
description: "Tsuki Tunes Mobile - Cyberpunk & Anime Music Player with Deezer API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Texts in lib/l10n/*.arb, compiled by `flutter gen-l10n`.
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI, Fonts and Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1

  # State Management
  provider: ^6.1.2

  # Audio Playback
  just_audio: ^0.9.46
  audio_video_progress_bar: ^2.0.3

  # Networking & Storage
  http: ^1.3.0
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.1

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.7

  # Share & Path
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Home Screen Widgets
  home_widget: ^0.7.0

  # Voice Search (on-device speech recognition)
  speech_to_text: ^7.5.0

  # Release radar: daily background check + local notifications
  workmanager: ^0.10.10
  flutter_local_notifications: ^19.4.2

  # Offline Translation (Google ML Kit)
  google_mlkit_translation: ^0.13.0

  # Spotify Native Playback
  spotify_sdk: ^4.0.0
  audio_session: ^0.1.25
  audio_service: ^0.18.19
  firebase_crashlytics: ^4.3.10
  firebase_app_check: ^0.3.2+10
  sensors_plus: ^7.1.1
  geolocator: ^14.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.1.0
  # Fake audio backend for widget tests.
  just_audio_platform_interface: ^4.6.0

flutter:
  uses-material-design: true
  # Compiles lib/l10n/*.arb (see l10n.yaml) on pub get and build.
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: SystemOfADown
      fonts:
        - asset: assets/fonts/sf_hollywood_hills.ttf
    - family: Metallica
      fonts:
        - asset: assets/fonts/pastor_of_muppets.ttf
    - family: HelveticaBlackOblique
      fonts:
        - asset: assets/fonts/helvetica_black_oblique.otf
    - family: HelveticaBlackRegular
      fonts:
        - asset: assets/fonts/helvetica_black_regular.otf
    - family: Sickness
      fonts:
        - asset: assets/fonts/sickness.ttf
    - family: Satisfaction
      fonts:
        - asset: assets/fonts/satisfaction.ttf
    - family: Squealer
      fonts:
        - asset: assets/fonts/squealer.ttf
    - family: Optionyx
      fonts:
        - asset: assets/fonts/optio_nyx.otf
    - family: Blackpink
      fonts:
        - asset: assets/fonts/blackpink.ttf
    - family: EuroSwh
      fonts:
        - asset: assets/fonts/euroswh.ttf
    - family: Resurrec
      fonts:
        - asset: assets/fonts/resurrec.ttf
    - family: Bootle
      fonts:
        - asset: assets/fonts/bootle.ttf
    - family: InstantZen
      fonts:
        - asset: assets/fonts/instant_zen.otf
    - family: Densmore
      fonts:
        - asset: assets/fonts/densmore.ttf
    - family: DaftFont
      fonts:
        - asset: assets/fonts/daft_font.ttf
    - family: Trixie
      fonts:
        - asset: assets/fonts/trixie.ttf
    - family: CenturyGothicItalic
      fonts:
        - asset: assets/fonts/century_gothic_italic.ttf
    - family: Rammstein
      fonts:
        - asset: assets/fonts/rammstein.ttf
    - family: Kashmir
      fonts:
        - asset: assets/fonts/kashmir.ttf
    - family: FrizQuadrata
      fonts:
        - asset: assets/fonts/friz_quadrata.otf
    - family: ScaryGlyphs
      fonts:
        - asset: assets/fonts/scary_glyphs.ttf
    - family: LaBamba
      fonts:
        - asset: assets/fonts/la_bamba.otf
    - family: LasVegas
      fonts:
        - asset: assets/fonts/las_vegas.ttf
    - family: Jamiroquai
      fonts:
        - asset: assets/fonts/jamiroquai.ttf
    - family: Americana
      fonts:
        - asset: assets/fonts/americana.otf
    - family: Exo
      fonts:
        - asset: assets/fonts/exo.ttf
