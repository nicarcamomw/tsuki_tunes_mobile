# Texts: edit lib/l10n/app_<code>.arb (Spanish is the template). The Dart
# code in lib/l10n/generated is rebuilt on `flutter pub get` and on every
# build (pubspec: flutter: generate: true), so it isn't committed.
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
