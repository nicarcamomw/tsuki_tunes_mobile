name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Independent of analyze-and-test so a lint nit never blocks getting an
  # installable APK; review those results before merging.
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The release build (two NDKs, R8, three ABIs) runs the stock runner
      # out of disk at packaging time. Drop preinstalled toolchains this
      # job never uses, including stale NDKs (the pinned one is installed
      # below).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/android/sdk/ndk/* /usr/local/lib/android/sdk/system-images
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The app pins a preview NDK; Gradle can't auto-install it until its
      # preview license is accepted. The version is read from the build file
      # so the two never drift.
      - name: Install pinned Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION"

      # android/gradle.properties gives Gradle an 8 GB heap plus 4 GB
      # metaspace, which on the 16 GB runner (alongside the Kotlin daemon and
      # Dart AOT) got the runner killed mid-build. The user-level file
      # overrides the project one for CI only.
      - name: Limit Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF

      # Signed with the debug key unless android/key.properties exists (see
      # android/app/build.gradle.kts). LASTFM_API_KEY is optional: without
      # it the song radio uses Deezer only. Phone ABIs only: x86_64 is for
      # emulators and would add a third Dart AOT compile.
      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: >-
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tsuki-tunes-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
