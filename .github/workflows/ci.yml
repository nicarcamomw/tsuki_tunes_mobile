name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Independent of analyze-and-test so a lint nit never blocks getting an
  # installable APK; review those results before merging.
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Signed with the debug key unless android/key.properties exists (see
      # android/app/build.gradle.kts). LASTFM_API_KEY is optional: without
      # it the song radio uses Deezer only.
      - name: Build release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: flutter build apk --release --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tsuki-tunes-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
