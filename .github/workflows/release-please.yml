name: Release Please

# Keeps a release PR open with the next version (from the commit messages)
# and its CHANGELOG. Merging it tags vX.Y.Z and creates the GitHub release;
# the Build workflow then attaches the APK and AAB to it.
#
# Needs Settings > Actions > General > Workflow permissions > "Allow GitHub
# Actions to create and approve pull requests", or it can't open the PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN starts no workflow on its own (GitHub
  # stops runs triggering runs), but a manual dispatch does: run the Build
  # on the new tag so the release gets its APK and AAB.
  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
