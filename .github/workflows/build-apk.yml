name: Build APK

on:
  push:
    branches: [main, ccr-5f5575bc-4meay6]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The signing key is committed encrypted; the password lives only in
      # the ANDROID_KEYSTORE_PASSWORD repository secret.
      - name: Decrypt signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kspass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/release-keystore.jks.enc \
            -out android/app/release.jks \
            -pass file:"$RUNNER_TEMP/kspass"
          rm "$RUNNER_TEMP/kspass"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=tsuki"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "tsuki-tunes-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tsuki-tunes-apk
          path: tsuki-tunes-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tsuki Tunes APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: tsuki-tunes-${{ github.run_number }}.apk
          body: |
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
