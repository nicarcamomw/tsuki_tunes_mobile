name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --exclude-tags golden --coverage

      - name: Check coverage gate (60% for providers + services)
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::No coverage data found"
            exit 1
          fi

          # Extract coverage for gated directories.
          check_coverage() {
            local dir="$1"
            local min="$2"
            local label="$3"

            # Filter lcov to only lines in the target directory.
            local total=0 hit=0
            while IFS= read -r line; do
              case "$line" in
                SF:*"$dir"*) in_scope=1 ;;
                SF:*) in_scope=0 ;;
                DA:*)
                  if [ "$in_scope" = 1 ]; then
                    total=$((total + 1))
                    count="${line#DA:*,}"
                    if [ "$count" != "0" ]; then hit=$((hit + 1)); fi
                  fi
                  ;;
              esac
            done < coverage/lcov.info

            if [ "$total" -eq 0 ]; then
              echo "⚠️  $label: no lines found — skipping"
              return 0
            fi

            pct=$((hit * 100 / total))
            if [ "$pct" -lt "$min" ]; then
              echo "::error::❌ $label coverage is ${pct}% (minimum ${min}%): ${hit}/${total} lines"
              return 1
            fi
            echo "✅ $label coverage: ${pct}% (${hit}/${total} lines)"
          }

          failed=0
          check_coverage "lib/presentation/state/" 60 "Providers" || failed=1
          check_coverage "lib/data/datasources/" 60 "Services" || failed=1
          check_coverage "lib/data/repositories/" 60 "Repositories" || failed=1
          check_coverage "lib/domain/usecases/" 60 "Use cases" || failed=1
          exit $failed

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Golden tests
        run: flutter test --tags golden

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  build:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /usr/local/lib/android/sdk/ndk/* /usr/local/lib/android/sdk/system-images \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/boost \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decrypt signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kspass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/release-keystore.jks.enc \
            -out android/app/release.jks \
            -pass file:"$RUNNER_TEMP/kspass"
          rm "$RUNNER_TEMP/kspass"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=tsuki"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          NDK_VERSION=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          "$SDKMANAGER" "ndk;$NDK_VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Limit Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Write CI env file
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          cat > config/prod.env <<EOF
          LASTFM_API_KEY=${LASTFM_API_KEY}
          BUILD_NUMBER=${{ github.run_number }}
          GIT_SHA=${{ github.sha }}
          USE_EMULATORS=false
          EOF

      - name: Build APK
        run: >-
          flutter build apk --release --split-per-abi --flavor prod
          --obfuscate --split-debug-info=build/symbols
          --build-number=${{ github.run_number }}
          --dart-define-from-file=config/prod.env

      - name: Build AAB
        run: >-
          flutter build appbundle --release --flavor prod
          --obfuscate --split-debug-info=build/symbols-aab
          --build-number=${{ github.run_number }}
          --dart-define-from-file=config/prod.env

      - name: Rename artifacts
        run: |
          OUT_APK=build/app/outputs/flutter-apk
          OUT_AAB=build/app/outputs/bundle/prodRelease
          N=${{ github.run_number }}
          mv "$OUT_APK/app-arm64-v8a-prod-release.apk" "tsuki-tunes-$N.apk"
          mv "$OUT_APK/app-armeabi-v7a-prod-release.apk" "tsuki-tunes-$N-armeabi-v7a.apk"
          mv "$OUT_APK/app-x86_64-prod-release.apk" "tsuki-tunes-$N-x86_64.apk"
          mv "$OUT_AAB/app-prod-release.aab" "tsuki-tunes-$N.aab"
          ls -lh tsuki-tunes-*

      - uses: actions/upload-artifact@v5
        with:
          name: tsuki-tunes-apk
          path: tsuki-tunes-*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: tsuki-tunes-aab
          path: tsuki-tunes-*.aab

      - name: Upload Dart symbols to Crashlytics
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # Dart obfuscation symbols
          for f in build/symbols/*.symbols; do
            [ -f "$f" ] && flutter symbolize --input="$f" 2>/dev/null || true
          done

      - name: Upload native symbols to Crashlytics
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set; symbols not uploaded to Crashlytics."
            exit 0
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          # The Crashlytics Gradle plugin uploads native (R8/NDK) symbols
          # when this task runs after a release build.
          cd android
          ./gradlew app:uploadCrashlyticsSymbolFileProdRelease || \
            echo "::warning::Native symbol upload failed (non-fatal)"
          cd ..
          rm "$RUNNER_TEMP/sa.json"

      - uses: actions/upload-artifact@v5
        with:
          name: debug-symbols
          path: |
            build/symbols/
            build/symbols-aab/
          retention-days: 90

      # Every push to main: a test build in Releases (apk-N, pre-release),
      # ready to install without waiting for a versioned release.
      - name: Publish test build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tsuki Tunes APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            tsuki-tunes-*.apk
            tsuki-tunes-*.aab
          body: |
            Built from `main` @ ${{ github.sha }}.

            Download `tsuki-tunes-${{ github.run_number }}.apk` (arm64) for almost any modern phone.
            The `armeabi-v7a` build is for old 32-bit phones; `x86_64` is for emulators.
            `tsuki-tunes-${{ github.run_number }}.aab` is for the Play Store.

      # A versioned release (vX.Y.Z, from merging the Release Please PR).
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tsuki-tunes-*.apk
            tsuki-tunes-*.aab
