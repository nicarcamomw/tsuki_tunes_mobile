name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
            /usr/local/lib/android/sdk/ndk/* /usr/local/lib/android/sdk/system-images \
            /usr/local/share/powershell /usr/share/swift /usr/local/share/boost \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decrypt signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/kspass"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/release-keystore.jks.enc \
            -out android/app/release.jks \
            -pass file:"$RUNNER_TEMP/kspass"
          rm "$RUNNER_TEMP/kspass"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=tsuki"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          NDK_VERSION=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          "$SDKMANAGER" "ndk;$NDK_VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Limit Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: >-
          flutter build apk --release --split-per-abi --flavor prod
          --obfuscate --split-debug-info=build/symbols
          --build-number=${{ github.run_number }}
          --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY"
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=GIT_SHA=${{ github.sha }}

      - name: Build AAB
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: >-
          flutter build appbundle --release --flavor prod
          --obfuscate --split-debug-info=build/symbols-aab
          --build-number=${{ github.run_number }}
          --dart-define=LASTFM_API_KEY="$LASTFM_API_KEY"
          --dart-define=BUILD_NUMBER=${{ github.run_number }}
          --dart-define=GIT_SHA=${{ github.sha }}

      - name: Rename artifacts
        run: |
          OUT_APK=build/app/outputs/flutter-apk
          OUT_AAB=build/app/outputs/bundle/prodRelease
          N=${{ github.run_number }}
          mv "$OUT_APK/app-arm64-v8a-prod-release.apk" "tsuki-tunes-$N.apk"
          mv "$OUT_APK/app-armeabi-v7a-prod-release.apk" "tsuki-tunes-$N-armeabi-v7a.apk"
          mv "$OUT_APK/app-x86_64-prod-release.apk" "tsuki-tunes-$N-x86_64.apk"
          mv "$OUT_AAB/app-prod-release.aab" "tsuki-tunes-$N.aab"
          ls -lh tsuki-tunes-*

      - uses: actions/upload-artifact@v4
        with:
          name: tsuki-tunes-apk
          path: tsuki-tunes-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tsuki-tunes-aab
          path: tsuki-tunes-*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: |
            build/symbols/
            build/symbols-aab/
          retention-days: 90

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tsuki-tunes-*.apk
            tsuki-tunes-*.aab
