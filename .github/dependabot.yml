version: 2
updates:
  # Flutter/Dart dependencies (pubspec.yaml)
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dart
    groups:
      firebase:
        patterns:
          - "firebase_*"
          - "cloud_*"
      flutter-plugins:
        patterns:
          - "flutter_*"
          - "go_router*"
          - "riverpod*"
          - "flutter_riverpod*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # npm (Firestore rules tests)
  - package-ecosystem: npm
    directory: /tool/firestore_rules_test
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
